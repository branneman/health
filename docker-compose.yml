# Local development only. Production deployment is out of scope for this repo.

# Pinned so the project name comes from this file rather than from whatever the checkout
# directory happens to be called. Without it, a worktree or a clone in a differently-named
# directory silently gets its own empty database while `container_name` below still points
# at the one you already have.
name: health

services:
  postgres:
    image: postgres:17-alpine
    container_name: health_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-mcp:
    image: crystaldba/postgres-mcp
    restart: unless-stopped
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: [ "--access-mode=unrestricted", "--transport=sse", "--sse-port=8001" ]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Pinned for the same reason as `name` above: this is the volume holding your local
  # development database, and it must resolve to the same one from any directory.
  pgdata:
    name: health_pgdata
